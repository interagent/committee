name: Release

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify and build gem
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify tag is on master
        run: git merge-base --is-ancestor HEAD origin/master
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: '3.4'
      - name: Verify tag and version
        run: test "$GITHUB_REF_NAME" = "v$(ruby -Ilib -rcommittee/version -e 'print Committee::VERSION')"
      - run: bundle install
      - run: bundle exec rake
      - run: gem build committee.gemspec --output "$RUNNER_TEMP/committee.gem"
      - name: Extract release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## $version" '
            $0 == heading || index($0, heading " ") == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: release-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/committee.gem
            ${{ runner.temp }}/release-notes.md
          if-no-files-found: error

  publish:
    name: Publish gem
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write # Required for RubyGems trusted publishing.
    steps:
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: '3.4'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact-id }}
          path: ${{ runner.temp }}
      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - name: Publish through RubyGems trusted publishing
        run: gem push "$RUNNER_TEMP/committee.gem"

  github-release:
    name: Create GitHub release
    needs: [verify, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create the GitHub release.
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact-id }}
          path: ${{ runner.temp }}
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
